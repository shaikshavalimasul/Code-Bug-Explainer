<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code Bug Explainer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }
        body {
            background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
            min-height: 100vh;
            color: #fff;
        }
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        .navbar .logo {
            color: #e94560;
            font-size: 22px;
            font-weight: bold;
        }
        .navbar .nav-links {
            display: flex;
            gap: 20px;
            align-items: center;
        }
        .navbar .welcome {
            color: #aaa;
            font-size: 14px;
        }
        .navbar a {
            color: #fff;
            text-decoration: none;
            padding: 8px 20px;
            border-radius: 8px;
            font-size: 14px;
            transition: background 0.3s;
        }
        .navbar a.history-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .navbar a.history-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        .navbar a.logout-btn {
            background: #e94560;
        }
        .navbar a.logout-btn:hover {
            background: #c73652;
        }
        .main {
            max-width: 900px;
            margin: 50px auto;
            padding: 0 20px;
        }
        .hero {
            text-align: center;
            margin-bottom: 40px;
        }
        .hero h1 {
            font-size: 42px;
            margin-bottom: 15px;
        }
        .hero h1 span {
            color: #e94560;
        }
        .hero p {
            color: #aaa;
            font-size: 16px;
        }
        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 35px;
            margin-bottom: 30px;
        }
        .form-row {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            align-items: center;
        }
        label {
            color: #aaa;
            font-size: 14px;
            margin-bottom: 8px;
            display: block;
        }
        select {
            padding: 12px 15px;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: #fff;
            font-size: 14px;
            outline: none;
            cursor: pointer;
        }
        select option {
            background: #1a1a2e;
        }
        textarea {
            width: 100%;
            height: 200px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: #fff;
            font-size: 14px;
            font-family: 'Courier New', monospace;
            resize: vertical;
            outline: none;
            transition: border 0.3s;
            margin-bottom: 20px;
        }
        textarea:focus {
            border: 1px solid #e94560;
        }
        textarea::placeholder {
            color: #555;
        }
        .explain-btn {
            width: 100%;
            padding: 15px;
            background: #e94560;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
            font-weight: bold;
            letter-spacing: 1px;
        }
        .explain-btn:hover {
            background: #c73652;
        }
        .explain-btn:disabled {
            background: #555;
            cursor: not-allowed;
        }
        .result-card {
            display: none;
            background: rgba(233, 69, 96, 0.05);
            border: 1px solid rgba(233, 69, 96, 0.3);
            border-radius: 20px;
            padding: 35px;
        }
        .result-card h2 {
            color: #e94560;
            margin-bottom: 15px;
            font-size: 20px;
        }
        .result-card p {
            color: #ddd;
            line-height: 1.8;
            font-size: 15px;
        }
        .loading {
            text-align: center;
            color: #aaa;
            font-size: 15px;
            display: none;
        }
        .loading span {
            color: #e94560;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo">🐛 Bug Explainer</div>
        <div class="nav-links">
            <span class="welcome">👋 Hello, {{ username }}!</span>
            <a href="/history" class="history-btn">📜 My History</a>
            <a href="/statistics" class="history-btn">📊 My Statistics</a>
            <a href="/logout" class="logout-btn">Logout</a>
        </div>
    </nav>

    <div class="main">
        <div class="hero">
            <h1>Fix Your Bugs with <span>AI</span></h1>
            <p>Paste your buggy code and get a simple explanation instantly</p>
        </div>

        <div class="card">
            <div class="form-row">
                <div>
                    <label>Select Language</label>
                    <select id="language">
                        <option value="python">🐍 Python</option>
                        <option value="java">☕ Java</option>
                        <option value="c++">⚙️ C++</option>
                        <option value="javascript">🌐 JavaScript</option>
                        <option value="c">🔵 C</option>
                        <option value="sql">🗄️ SQL</option>
                    </select>
                </div>
            </div>
            <label>Your Buggy Code</label>
            <textarea id="code" placeholder="Paste your buggy code here..."></textarea>
            <button class="explain-btn" onclick="explainBug()">🔍 Explain My Bug</button>
        </div>

        <div class="loading" id="loading">
            <p>🤖 AI is analyzing your code<span>...</span></p>
        </div>

        <div class="result-card" id="result">
            <h2>🧠 AI Explanation</h2>
            <p id="explanation"></p>
        </div>
    </div>

   <script>
    async function explainBug() {
        const code = document.getElementById('code').value;
        const language = document.getElementById('language').value;
        const resultCard = document.getElementById('result');
        const explanation = document.getElementById('explanation');
        const loading = document.getElementById('loading');
        const btn = document.querySelector('.explain-btn');

        if (!code.trim()) {
            alert('Please paste your buggy code first!');
            return;
        }

        btn.disabled = true;
        btn.innerText = 'Analyzing...';
        loading.style.display = 'block';
        resultCard.style.display = 'none';

        const response = await fetch('/explain', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({code: code, language: language})
        });

        const data = await response.json();

        loading.style.display = 'none';
        resultCard.style.display = 'block';

        if (data.duplicate) {
            resultCard.style.border = '1px solid #f39c12';
            document.querySelector('.result-card h2').innerHTML =
                '⚠️ Similar Bug Found! (' + data.similarity + '% match)';

            explanation.innerHTML = `
                <p style="color:#aaa; margin-bottom:15px;">
                    We found a similar bug in your history!
                    What would you like to do?
                </p>
                <div style="display:flex; gap:10px; margin-bottom:20px;">
                    <button onclick="showPreviousExplanation()" 
                        style="flex:1; padding:12px; background:rgba(243,156,18,0.2); 
                        border:1px solid #f39c12; color:#f39c12; border-radius:10px; 
                        cursor:pointer; font-size:14px;">
                        ✅ Use Previous Explanation
                    </button>
                    <button onclick="getFreshExplanation()" 
                        style="flex:1; padding:12px; background:rgba(233,69,96,0.2); 
                        border:1px solid #e94560; color:#e94560; border-radius:10px; 
                        cursor:pointer; font-size:14px;">
                        🔄 Get Fresh Explanation
                    </button>
                </div>
            `;

            window._previousExplanation = data.explanation;
            window._currentCode = document.getElementById('code').value;
            window._currentLanguage = document.getElementById('language').value;

        } else {
            resultCard.style.border = '1px solid rgba(233, 69, 96, 0.3)';
            document.querySelector('.result-card h2').innerHTML = '🧠 AI Explanation';

            let text = data.explanation;
            text = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            text = text.replace(/```[\w]*\n?([\s\S]*?)```/g,
                '<pre class="code-block">$1</pre>');
            text = text.replace(/\n\n/g, '</p><p>');
            text = text.replace(/\n/g, '<br>');
            explanation.innerHTML = '<p>' + text + '</p>';
        }

        btn.disabled = false;
        btn.innerText = '🔍 Explain My Bug';
    }

    function showPreviousExplanation() {
        const explanation = document.getElementById('explanation');
        const resultCard = document.getElementById('result');

        resultCard.style.border = '1px solid #f39c12';
        document.querySelector('.result-card h2').innerHTML =
            '✅ Previous Explanation';

        let text = window._previousExplanation;
        text = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
        text = text.replace(/```[\w]*\n?([\s\S]*?)```/g,
            '<pre class="code-block">$1</pre>');
        text = text.replace(/\n\n/g, '</p><p>');
        text = text.replace(/\n/g, '<br>');
        explanation.innerHTML = '<p>' + text + '</p>';
    }

    async function getFreshExplanation() {
        const explanation = document.getElementById('explanation');
        const resultCard = document.getElementById('result');
        const loading = document.getElementById('loading');
        const btn = document.querySelector('.explain-btn');

        explanation.innerHTML = '';
        resultCard.style.display = 'none';
        loading.style.display = 'block';
        btn.disabled = true;
        btn.innerText = 'Analyzing...';

        const response = await fetch('/explain_fresh', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                code: window._currentCode,
                language: window._currentLanguage
            })
        });

        const data = await response.json();

        loading.style.display = 'none';
        resultCard.style.display = 'block';
        resultCard.style.border = '1px solid rgba(233, 69, 96, 0.3)';
        document.querySelector('.result-card h2').innerHTML = 
            '🧠 Fresh AI Explanation';

        let text = data.explanation;
        text = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
        text = text.replace(/```[\w]*\n?([\s\S]*?)```/g,
            '<pre class="code-block">$1</pre>');
        text = text.replace(/\n\n/g, '</p><p>');
        text = text.replace(/\n/g, '<br>');
        explanation.innerHTML = '<p>' + text + '</p>';

        btn.disabled = false;
        btn.innerText = '🔍 Explain My Bug';
    }
</script>
</body>
</html>
